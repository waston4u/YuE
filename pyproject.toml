[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-infer"
version = "0.1.6"
description = "YuE2 music generation with editable symbolic plans"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "MODEL_LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
# transformers 5.x is not viable yet (5.17 pins an unreleased tokenizers<=0.23.0;
# 5.16 crashes under Python 3.14's lazy-module semantics). torch 2.14.0's cp314
# wheel fails at import — 2.13.x is the newest working line.
dependencies = [
    "torch>=2.10,<2.14",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "tiktoken==0.14.0",
    "numpy==2.5.3",
    "soundfile==0.14.0",
    "accelerate==1.15.0",
    # Apple Silicon engine — Metal-backed tensor ops, int4/int8 weight
    # packing. macOS/arm64-only wheels; the pipeline falls back to torch
    # if it can't be imported.
    "mlx==0.32.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/multimodal-art-projection/YuE"
Demo = "https://map-yue2.github.io/"
Models = "https://huggingface.co/m-a-p/YuE2-3B"

[project.scripts]
yue2 = "yue2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
