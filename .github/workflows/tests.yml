name: Apple Silicon tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.10,<2.14'
          python -m pip install '.[test]'
      - name: Check public commands
        run: |
          yue2 --help
          yue2 generate --help
          yue2 batch --help
          yue2 doctor
      - name: Run tests without model downloads
        run: python -m pytest -q
